<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings — Abiruchi Hotel Operating System</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #12151f;
      --border: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #fc8019;
      --accent: #10b981;
      --sky: #38bdf8;
      --amber: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
    .sidebar { width: 220px; min-height: 100vh; background: #0d1017; border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .sidebar-brand { font-size: 1.15rem; font-weight: 900; color: #fff; padding: 12px 12px 20px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
    .nav-link { display: block; padding: 10px 12px; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: 0.88rem; font-weight: 600; transition: all 0.15s ease; }
    .nav-link:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .nav-link.active { background: rgba(252,128,25,0.15); color: var(--primary); font-weight: 800; }
    .main-content { flex: 1; padding: 24px; overflow-y: auto; }
    .page-title { font-size: 1.5rem; font-weight: 800; color: #fff; margin-bottom: 20px; letter-spacing: -0.02em; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
    .btn { padding: 6px 12px; border-radius: 8px; border: none; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 4px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #e57315; }
    .btn-success { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
    .btn-success:hover { background: rgba(16,185,129,0.25); }
    .btn-danger { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 800; }
    .badge-green { background: rgba(16,185,129,0.15); color: #10b981; }
    .badge-amber { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .badge-blue { background: rgba(56,189,248,0.15); color: #38bdf8; }
    .badge-purple { background: rgba(168,85,247,0.15); color: #c084fc; }
    .badge-red { background: rgba(239,68,68,0.15); color: #ef4444; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media(max-width:768px) { body { flex-direction: column; } .sidebar { width: 100%; min-height: auto; flex-direction: row; flex-wrap: wrap; padding: 12px; } .sidebar-brand { display: none; } }
    .date-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .date-label { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .slots-grid { display: flex; flex-direction: column; gap: 8px; }
    .slot-row { display: grid; grid-template-columns: 70px 1fr; gap: 12px; align-items: start; }
    .slot-time { font-size: 0.8rem; color: var(--muted); font-weight: 600; padding-top: 10px; }
    .slot-bookings { display: flex; flex-direction: column; gap: 8px; }
    .booking-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; animation: fadeInUp 0.3s ease; }
    .booking-info .guest-name { font-weight: 700; font-size: 0.95rem; }
    .booking-info .meta { font-size: 0.78rem; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 8px; }
    .empty-slot { font-size: 0.78rem; color: rgba(255,255,255,0.1); padding: 10px 0; }
    .summary-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .summary-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .summary-label { font-size: 0.72rem; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .summary-value { font-size: 1.4rem; font-weight: 800; color: #fff; margin-top: 4px; }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-brand">🍽️ ABIRUCHI HOTEL</div>
    <a href="/owner" class="nav-link">📊 Dashboard</a>
    <a href="/owner/orders" class="nav-link">🎫 Orders</a>
    <a href="/owner/availability" class="nav-link">🔴 Availability</a>
    <a href="/owner/payments" class="nav-link">💳 Payments</a>
    <a href="/owner/tokens" class="nav-link">🎟️ Tokens</a>
    <a href="/owner/bookings" class="nav-link active">📅 Bookings</a>
    <a href="/owner/staff" class="nav-link">👥 Staff</a>
    <a href="/owner/settings" class="nav-link">⚙️ Settings</a>
    <div style="margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,0.08);">
      <a href="/" class="nav-link" target="_blank" rel="noopener noreferrer">👁️ Guest View</a>
    </div>
  </nav>

  <div class="main-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
      <h1 class="page-title" style="margin-bottom:0;">Table Reservations & Host Stand</h1>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn btn-primary" onclick="setBookingView('grid', this)">📅 Today's Grid</button>
        <button type="button" class="btn" style="background:#1e293b; color:#fff;" onclick="setBookingView('noshows', this)">🚩 No-Shows</button>
        <button type="button" class="btn" style="background:#1e293b; color:#fff;" onclick="setBookingView('recurring', this)">🔁 Recurring</button>
        <button type="button" class="btn btn-primary" onclick="fetchBookings()">↻ Refresh</button>
      </div>
    </div>

    <div class="summary-cards">
      <div class="summary-card">
        <div class="summary-label">Total Bookings</div>
        <div class="summary-value" id="totalBookings">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Confirmed</div>
        <div class="summary-value" id="confirmedCount" style="color:var(--sky);">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Checked In</div>
        <div class="summary-value" id="checkedIn" style="color:#10b981;">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Completed</div>
        <div class="summary-value" id="completedCount" style="color:#c084fc;">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Total Covers</div>
        <div class="summary-value" id="totalCovers">0</div>
      </div>
    </div>

    <div class="date-header">
      <span class="date-label" id="dateLabel"></span>
    </div>

    <div class="slots-grid" id="slotsGrid">
      <div style="text-align:center; padding:48px; color:var(--muted);">Loading bookings...</div>
    </div>
  </div>

  <script>
    const OUTLET_ID = 'b0000000-0000-0000-0000-000000000001';
    const SLOTS = ['12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30','20:00','20:30','21:00','21:30','22:00'];
    let bookings = [];

    document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });

    function showBanner(msg, isErr = false) {
      const el = document.createElement('div');
      el.style.cssText = `position:fixed;top:16px;right:16px;padding:12px 20px;border-radius:12px;font-weight:700;font-size:0.88rem;z-index:1000;background:${isErr ? '#ef4444' : '#059669'};color:#fff;box-shadow:0 8px 24px rgba(0,0,0,0.5);`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    async function confirmBooking(id) {
      try {
        const res = await fetch(`/api/v1/bookings/${id}/confirm`, { method:'POST' });
        if (res.ok) { fetchBookings(); showBanner('Reservation Confirmed ✓'); }
        else { showBanner('Failed to confirm reservation', true); }
      } catch(e) { showBanner(e.message, true); }
    }

    async function checkIn(id) {
      try {
        const res = await fetch(`/api/v1/bookings/${id}/check-in`, { method:'POST' });
        if (res.ok) { fetchBookings(); showBanner('Guest Checked In ✓'); }
        else { showBanner('Check-in failed', true); }
      } catch(e) { showBanner(e.message, true); }
    }

    async function completeBooking(id) {
      try {
        const res = await fetch(`/api/v1/bookings/${id}/complete`, { method:'POST' });
        if (res.ok) { fetchBookings(); showBanner('Booking Completed ✓'); }
        else { showBanner('Failed to complete', true); }
      } catch(e) { showBanner(e.message, true); }
    }

    async function rejectBooking(id) {
      if (!confirm('Are you sure you want to reject/cancel this booking?')) return;
      try {
        const res = await fetch(`/api/v1/bookings/${id}/reject`, { method:'POST' });
        if (res.ok) { fetchBookings(); showBanner('Booking Rejected ✕'); }
        else { showBanner('Failed to reject', true); }
      } catch(e) { showBanner(e.message, true); }
    }

    function getSlot(booking) {
      const t = booking.time || booking.reservationTime || booking.scheduledAt || booking.slotTime || '';
      const match = t.match(/(\d{1,2}):(\d{2})/);
      if (!match) return null;
      const h = match[1].padStart(2,'0');
      const m = parseInt(match[2]) < 30 ? '00' : '30';
      return `${h}:${m}`;
    }

    function renderBookings() {
      const grid = document.getElementById('slotsGrid');
      const checkedIn = bookings.filter(b => b.checkedIn || b.status==='CHECKED_IN').length;
      const confirmed = bookings.filter(b => b.status === 'CONFIRMED').length;
      const completed = bookings.filter(b => b.status === 'COMPLETED').length;

      document.getElementById('totalBookings').textContent = bookings.length;
      document.getElementById('confirmedCount').textContent = confirmed;
      document.getElementById('checkedIn').textContent = checkedIn;
      document.getElementById('completedCount').textContent = completed;
      document.getElementById('totalCovers').textContent = bookings.reduce((s,b) => s+(b.partySize||b.guests||0),0);

      const bySlot = {};
      bookings.forEach(b => {
        const slot = getSlot(b) || '19:30';
        if (!bySlot[slot]) bySlot[slot] = [];
        bySlot[slot].push(b);
      });

      grid.innerHTML = SLOTS.map(slot => {
        const slotBookings = bySlot[slot] || [];
        return `<div class="slot-row">
          <div class="slot-time">${slot}</div>
          <div class="slot-bookings">
            ${slotBookings.length ? slotBookings.map(b => {
              const status = b.status || (b.checkedIn ? 'CHECKED_IN' : 'PENDING');
              return `
              <div class="booking-card">
                <div class="booking-info">
                  <div class="guest-name">${b.guestName || b.name || 'Guest'}</div>
                  <div class="meta">
                    <span>🪑 ${b.partySize||b.guests||2} guests</span>
                    <span>•</span>
                    <span>📞 ${b.guestPhone || b.phone || '—'}</span>
                    <span>•</span>
                    <span>Table ${b.tableNumber||b.table||'Assigned on arrival'}</span>
                    ${b.statusBadge || ''}
                  </div>
                </div>
                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;">
                  ${status === 'PENDING' ? `
                    <span class="badge badge-amber">PENDING</span>
                    <button type="button" class="btn btn-primary" onclick="confirmBooking('${b.id}')">Confirm</button>
                    <button type="button" class="btn btn-danger" onclick="rejectBooking('${b.id}')">Reject</button>
                  ` : status === 'CONFIRMED' ? `
                    <span class="badge badge-blue">CONFIRMED</span>
                    <button type="button" class="btn btn-success" onclick="checkIn('${b.id}')">Check In</button>
                    <button type="button" class="btn btn-primary" style="background:#0284c7;" onclick="rescheduleBookingPrompt('${b.id}')">Reschedule</button>
                    <button type="button" class="btn btn-primary" style="background:#22c55e;" onclick="sendWhatsAppPrompt('${b.id}')">💬 WhatsApp</button>
                    <button type="button" class="btn btn-danger" style="background:#f59e0b;" onclick="overrideBookingPrompt('${b.id}')">⚡ Override</button>
                    <button type="button" class="btn btn-danger" onclick="rejectBooking('${b.id}')">Cancel</button>
                  ` : status === 'CHECKED_IN' ? `
                    <span class="badge badge-green">✓ SEATED</span>
                    <button type="button" class="btn btn-success" onclick="completeBooking('${b.id}')">Complete</button>
                  ` : status === 'COMPLETED' ? `
                    <span class="badge badge-purple">✓ COMPLETED</span>
                  ` : `
                    <span class="badge badge-red">CANCELLED</span>
                    <button type="button" class="btn btn-primary" style="background:#64748b; font-size:0.75rem;" onclick="refundDepositPrompt('${b.id}')">↩ Refund</button>
                  `}
                </div>
              </div>`;
            }).join('') : `<div class="empty-slot">—</div>`}
          </div>
        </div>`;
      }).join('');
    }

    async function fetchBookings() {
      try {
        const res = await fetch(`/api/v1/bookings?outletId=${OUTLET_ID}`);
        if (res.ok) {
          const data = await res.json();
          bookings = Array.isArray(data) ? data : (data.bookings || data.data || []);
          renderBookings();
        }
      } catch(e) { console.error(e); }
    }

    async function rescheduleBookingPrompt(id) {
      const date = prompt('Enter new date (YYYY-MM-DD):', new Date().toISOString().slice(0, 10));
      const slot = prompt('Enter new slot time (e.g. 20:00):', '20:00');
      if (!date || !slot) return;
      try {
        const res = await fetch(`/api/v1/bookings/${id}/reschedule`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date, slot })
        });
        if (res.ok) { fetchBookings(); showBanner('Rescheduled Successfully ✓'); }
        else { showBanner('Reschedule failed', true); }
      } catch (e) { showBanner(e.message, true); }
    }

    async function sendWhatsAppPrompt(id) {
      try {
        const res = await fetch(`/api/v1/bookings/${id}/whatsapp`, { method: 'POST' });
        const data = await res.json();
        if (data.whatsappLink) {
          window.open(data.whatsappLink, '_blank');
          showBanner('WhatsApp reminder link opened ✓');
        } else {
          showBanner('Failed to generate WhatsApp reminder', true);
        }
      } catch (e) { showBanner(e.message, true); }
    }

    async function overrideBookingPrompt(id) {
      const walkInName = prompt('Enter walk-in guest name for table override:', 'Walk-in VIP Guest');
      if (!walkInName) return;
      try {
        const res = await fetch(`/api/v1/bookings/${id}/override`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ guestName: walkInName, partySize: 2 })
        });
        if (res.ok) { fetchBookings(); showBanner('Walk-in table override complete (Booking bumped) ⚡'); }
        else { showBanner('Override failed', true); }
      } catch (e) { showBanner(e.message, true); }
    }

    async function refundDepositPrompt(id) {
      const reason = prompt('Enter deposit refund reason:', 'Cancellation within free window');
      if (!reason) return;
      try {
        const res = await fetch(`/api/v1/bookings/${id}/refund`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason })
        });
        if (res.ok) { fetchBookings(); showBanner('Booking deposit refunded ✓'); }
        else { showBanner('Refund failed', true); }
      } catch (e) { showBanner(e.message, true); }
    }

    async function setBookingView(view, btn) {
      const grid = document.getElementById('slotsGrid');
      if (view === 'grid') {
        fetchBookings();
        return;
      }
      if (view === 'noshows') {
        try {
          const res = await fetch('/api/v1/bookings/no-shows');
          const data = await res.json();
          const list = data.noShows || [];
          grid.innerHTML = `
            <div style="background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px;">
              <h2 style="font-size:1.2rem; font-weight:800; margin-bottom:12px; color:var(--red);">🚩 Past No-Shows (${list.length})</h2>
              ${list.length ? list.map(b => `
                <div style="border-bottom:1px solid var(--border); padding:10px 0; display:flex; justify-content:space-between; align-items:center;">
                  <div>
                    <div style="font-weight:700;">${b.guestName} (${b.guestPhone || 'No Phone'})</div>
                    <div style="font-size:0.8rem; color:var(--muted);">${b.slotDate} at ${b.slotTime} • Party: ${b.partySize}</div>
                  </div>
                  <span class="badge badge-red">NO-SHOW</span>
                </div>
              `).join('') : '<div style="color:var(--muted);">Zero no-shows recorded.</div>'}
            </div>
          `;
        } catch (e) { showBanner('Failed to load no-shows', true); }
      }
      if (view === 'recurring') {
        try {
          const res = await fetch('/api/v1/bookings/recurring');
          const data = await res.json();
          const list = data.bookings || [];
          grid.innerHTML = `
            <div style="background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px;">
              <h2 style="font-size:1.2rem; font-weight:800; margin-bottom:12px; color:var(--sky);">🔁 Recurring Bookings (${list.length})</h2>
              ${list.length ? list.map(b => `
                <div style="border-bottom:1px solid var(--border); padding:10px 0; display:flex; justify-content:space-between; align-items:center;">
                  <div>
                    <div style="font-weight:700;">${b.guestName} (${b.guestPhone || 'No Phone'})</div>
                    <div style="font-size:0.8rem; color:var(--muted);">Recurrence: ${b.recurrence_pattern || 'WEEKLY'} (${b.occurrencesCount || 8} occurrences)</div>
                  </div>
                  <span class="badge badge-blue">RECURRING</span>
                </div>
              `).join('') : '<div style="color:var(--muted);">Zero recurring bookings.</div>'}
            </div>
          `;
        } catch (e) { showBanner('Failed to load recurring bookings', true); }
      }
    }

    fetchBookings();
    setInterval(fetchBookings, 20000);
  </script>
</body>
</html>
