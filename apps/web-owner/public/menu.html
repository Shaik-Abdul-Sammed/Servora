<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu & Photo Studio — Abiruchi Hotel Owner</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #12151f;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #fc8019;
      --primary-hover: #e06d0c;
      --accent: #10b981;
      --sky: #38bdf8;
      --amber: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
    .sidebar { width: 230px; min-height: 100vh; background: #0d1017; border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .sidebar-brand { font-size: 1.15rem; font-weight: 900; color: #fff; padding: 12px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
    .brand-s { width: 26px; height: 26px; background: linear-gradient(135deg, #ff5200, #fc8019); border-radius: 7px; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1rem; }
    .nav-link { display: block; padding: 10px 12px; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: 0.88rem; font-weight: 600; transition: all 0.15s ease; }
    .nav-link:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .nav-link.active { background: rgba(252, 128, 25, 0.15); color: #fc8019; }
    .main-content { flex: 1; padding: 24px; overflow-y: auto; max-width: 1200px; margin: 0 auto; }
    .page-title { font-size: 1.5rem; font-weight: 800; color: #fff; margin-bottom: 6px; letter-spacing: -0.02em; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    
    .btn { padding: 8px 16px; border-radius: 8px; border: none; font-size: 0.85rem; font-weight: 800; cursor: pointer; transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-secondary { background: rgba(255,255,255,0.08); color: #fff; }
    .btn-secondary:hover { background: rgba(255,255,255,0.12); }
    .btn-danger { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }

    .dish-row { display: flex; align-items: center; gap: 16px; padding: 14px; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; transition: border-color 0.15s ease; }
    .dish-row:hover { border-color: rgba(252, 128, 25, 0.4); }
    .dish-thumb { width: 78px; height: 72px; border-radius: 12px; object-fit: cover; background: #1e2433; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 800; }

    /* Modal / Form Styling */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-box { background: #161a26; border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 0.76rem; font-weight: 800; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: #0c0e14; color: #fff; font-size: 0.9rem; font-family: inherit; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--primary); }

    /* Photo Presets Gallery */
    .photo-presets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 8px; }
    .photo-preset-item { width: 100%; height: 64px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 2px solid transparent; transition: all 0.15s ease; }
    .photo-preset-item:hover, .photo-preset-item.selected { border-color: var(--primary); transform: scale(1.04); }

    .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 10px; background: #1e293b; color: #fff; font-size: 0.88rem; font-weight: 700; display: none; z-index: 200; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .toast.success { background: #065f46; border: 1px solid #10b981; }
    .toast.error { background: #7f1d1d; border: 1px solid #ef4444; }
  </style>
</head>
<body>
  <div id="navContainer"></div>
  <main class="main-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
      <div>
        <h1 class="page-title">📖 Menu & High-Res Food Imagery</h1>
        <p style="font-size:0.85rem; color:var(--muted);">Add and manage dishes with food photography, Indian Rupee pricing (₹), dietary badges, and ingredients.</p>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-secondary" onclick="exportMenuJson()">📥 Export JSON</button>
        <button class="btn btn-primary" onclick="openAddDishModal()">➕ Add New Dish</button>
      </div>
    </div>

    <!-- Active Menu Items List -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-size:1.1rem; font-weight:800;">Dishes in Active Menu</h3>
        <span id="dishCountBadge" class="badge" style="background:rgba(252,128,25,0.15); color:var(--primary);">0 Dishes</span>
      </div>
      <div id="menuItemsList">
        <p style="color:var(--muted); font-size:0.88rem;">Loading menu catalog...</p>
      </div>
    </div>
  </main>

  <!-- Add / Edit Dish Modal -->
  <div id="dishModal" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
        <h3 id="modalTitle" style="font-size:1.2rem; font-weight:900;">➕ Add Food Item with Photo</h3>
        <button onclick="closeDishModal()" style="background:none; border:none; color:var(--muted); font-size:1.3rem; cursor:pointer;">✕</button>
      </div>

      <input type="hidden" id="editItemId" value="" />

      <div class="form-group">
        <label class="form-label">Dish Name *</label>
        <input type="text" id="dishName" class="form-input" placeholder="e.g. Paneer Butter Masala, Wood-Fired Margherita" required />
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label class="form-label">Category *</label>
          <select id="dishCategory" class="form-select"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Price in ₹ (INR) *</label>
          <input type="number" id="dishPriceINR" class="form-input" placeholder="299" min="0" step="1" required />
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label class="form-label">Dietary Type *</label>
          <select id="dishDietary" class="form-select">
            <option value="VEG">🟢 Vegetarian (FSSAI Green)</option>
            <option value="NON_VEG">🔴 Non-Vegetarian (FSSAI Red)</option>
            <option value="EGG">🟡 Contains Egg (FSSAI Yellow)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Kitchen Station *</label>
          <select id="dishStation" class="form-select">
            <option value="PIZZA_OVEN">Pizza Oven</option>
            <option value="GRILL">Grill & Hot Line</option>
            <option value="COLD_PREP">Cold Prep & Salads</option>
            <option value="COFFEE">Coffee Bar</option>
            <option value="BAR">Bar & Mocktails</option>
            <option value="DESSERT">Dessert Station</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Description & Ingredients</label>
        <textarea id="dishDesc" class="form-textarea" rows="2" placeholder="Describe the flavors, texture, and preparation details..."></textarea>
      </div>

      <!-- Food Image Studio -->
      <div class="form-group" style="background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:12px; padding:14px;">
        <label class="form-label" style="color:var(--primary);">📸 Food Photography & Image Studio</label>
        <div style="display:flex; gap:12px; align-items:center; margin-bottom:10px;">
          <img id="imagePreview" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&q=80"
               style="width:80px; height:80px; border-radius:10px; object-fit:cover; border:1px solid rgba(255,255,255,0.2); background:#1e2433;"
               onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&q=80';" />
          <div style="flex:1;">
            <input type="url" id="dishImageUrl" class="form-input" placeholder="Paste custom image URL..." oninput="updateImagePreview(this.value)" />
            <div style="display:flex; align-items:center; gap:8px; margin-top:6px;">
              <label class="btn btn-secondary" style="font-size:0.75rem; padding:4px 10px; cursor:pointer;">
                📁 Choose File From Computer
                <input type="file" accept="image/*" style="display:none;" onchange="handleFileUpload(event)" />
              </label>
              <span style="font-size:0.7rem; color:var(--muted);">or choose from high-res presets below:</span>
            </div>
          </div>
        </div>

        <!-- Curated 1-Tap Food Photo Presets -->
        <label class="form-label" style="font-size:0.7rem; margin-top:8px;">Instant 1-Tap Food Photography Presets:</label>
        <div class="photo-presets-grid">
          <img class="photo-preset-item" title="Margherita Pizza" src="https://images.unsplash.com/photo-1604382355076-af4b0eb60143?w=300&q=80" onclick="selectPresetPhoto(this.src)" />
          <img class="photo-preset-item" title="Pepperoni Pizza" src="https://images.unsplash.com/photo-1628840042765-356cda07504e?w=300&q=80" onclick="selectPresetPhoto(this.src)" />
          <img class="photo-preset-item" title="Truffle Pasta" src="https://images.unsplash.com/photo-1621996346565-e3d5d6281724?w=300&q=80" onclick="selectPresetPhoto(this.src)" />
          <img class="photo-preset-item" title="Burrata Salad" src="https://images.unsplash.com/photo-1592417817098-8f3d6910985c?w=300&q=80" onclick="selectPresetPhoto(this.src)" />
          <img class="photo-preset-item" title="Chicken Biryani" src="https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=300&q=80" onclick="selectPresetPhoto(this.src)" />
          <img class="photo-preset-item" title="Paneer Tikka" src="https://images.unsplash.com/photo-1599488615731-7e5c2823ff28?w=300&q=80" onclick="selectPresetPhoto(this.src)" />
          <img class="photo-preset-item" title="Espresso Coffee" src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=300&q=80" onclick="selectPresetPhoto(this.src)" />
          <img class="photo-preset-item" title="Fresh Mocktail" src="https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=300&q=80" onclick="selectPresetPhoto(this.src)" />
          <img class="photo-preset-item" title="Chocolate Tiramisu" src="https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=300&q=80" onclick="selectPresetPhoto(this.src)" />
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
        <button type="button" class="btn btn-secondary" onclick="closeDishModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveDishAction()">💾 Save Food Item</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/owner/shared.js"></script>
  <script>
    document.getElementById('navContainer').innerHTML = renderNav('menu');

    let allCategories = [];
    let allMenuItems = [];

    function showToast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast ' + type;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    async function loadMenu() {
      try {
        const res = await apiFetch('/api/v1/menu');
        const data = await res.json();
        allCategories = data.categories || [];
        allMenuItems = data.items || [];

        // Populate category dropdown in modal
        const catSelect = document.getElementById('dishCategory');
        catSelect.innerHTML = allCategories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

        document.getElementById('dishCountBadge').textContent = `${allMenuItems.length} Dishes`;

        const listEl = document.getElementById('menuItemsList');
        if (allMenuItems.length === 0) {
          listEl.innerHTML = '<p style="color:var(--muted); padding:20px; text-align:center;">No dishes found. Click "Add New Dish" to create one.</p>';
          return;
        }

        listEl.innerHTML = allMenuItems.map(item => `
          <div class="dish-row" id="dish-row-${item.id}">
            <img class="dish-thumb"
                 src="${item.imageUrl || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200&q=80'}"
                 alt="${item.name}"
                 onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200&q=80';" />
            <div style="flex:1;">
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-weight:800; font-size:1.02rem; color:#fff;">${item.name}</span>
                <span class="badge" style="background:${item.dietaryType==='VEG'?'rgba(34,197,94,0.15)':item.dietaryType==='EGG'?'rgba(234,179,8,0.15)':'rgba(239,68,68,0.15)'};color:${item.dietaryType==='VEG'?'#22c55e':item.dietaryType==='EGG'?'#eab308':'#ef4444'};">
                  ${item.dietaryType==='VEG'?'🟢 VEG':item.dietaryType==='EGG'?'🟡 EGG':'🔴 NON-VEG'}
                </span>
                <span class="badge" style="background:rgba(255,255,255,0.06);color:var(--muted);">${item.station || 'PIZZA_OVEN'}</span>
              </div>
              <p style="font-size:0.8rem; color:var(--muted); margin-top:3px;">${item.description || 'No description added'}</p>
              <div style="font-size:0.75rem; color:var(--sky); margin-top:3px;">Allergens: ${(item.allergens || []).join(', ') || 'None declared'}</div>
            </div>
            <div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
              <div style="font-size:1.15rem; font-weight:900; color:#fff;">₹${(item.basePriceCents / 100).toFixed(0)}</div>
              <div style="display:flex; gap:6px;">
                <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.75rem;" onclick="toggleItem86('${item.id}', ${!item.isAvailable})">
                  ${item.isAvailable ? '✅ Active' : '⏸ 86 (Sold Out)'}
                </button>
                <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.75rem;" onclick="openEditDishModal('${item.id}')">✏️ Edit</button>
                <button class="btn btn-danger" style="padding:4px 8px; font-size:0.75rem;" onclick="deleteDish('${item.id}', '${item.name.replace(/'/g, "\\'")}')">🗑️</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        showToast('Error loading menu: ' + err.message, 'error');
      }
    }

    function openAddDishModal() {
      document.getElementById('modalTitle').textContent = '➕ Add Food Item with Photo';
      document.getElementById('editItemId').value = '';
      document.getElementById('dishName').value = '';
      document.getElementById('dishPriceINR').value = '';
      document.getElementById('dishDesc').value = '';
      document.getElementById('dishImageUrl').value = 'https://images.unsplash.com/photo-1604382355076-af4b0eb60143?w=400&q=80';
      updateImagePreview('https://images.unsplash.com/photo-1604382355076-af4b0eb60143?w=400&q=80');
      document.getElementById('dishModal').style.display = 'flex';
    }

    function openEditDishModal(id) {
      const item = allMenuItems.find(i => i.id === id);
      if (!item) return;
      document.getElementById('modalTitle').textContent = '✏️ Edit Food Item';
      document.getElementById('editItemId').value = item.id;
      document.getElementById('dishName').value = item.name;
      document.getElementById('dishCategory').value = item.categoryId;
      document.getElementById('dishPriceINR').value = (item.basePriceCents / 100).toFixed(0);
      document.getElementById('dishDietary').value = item.dietaryType || 'NON_VEG';
      document.getElementById('dishStation').value = item.station || 'PIZZA_OVEN';
      document.getElementById('dishDesc').value = item.description || '';
      document.getElementById('dishImageUrl').value = item.imageUrl || '';
      updateImagePreview(item.imageUrl || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&q=80');
      document.getElementById('dishModal').style.display = 'flex';
    }

    function closeDishModal() {
      document.getElementById('dishModal').style.display = 'none';
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'dishModal') closeDishModal();
    }

    function updateImagePreview(url) {
      const img = document.getElementById('imagePreview');
      img.src = url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&q=80';
    }

    function selectPresetPhoto(url) {
      document.getElementById('dishImageUrl').value = url;
      updateImagePreview(url);
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const base64 = e.target.result;
        document.getElementById('dishImageUrl').value = base64;
        updateImagePreview(base64);
        showToast('Photo loaded into studio!');
      };
      reader.readAsDataURL(file);
    }

    async function saveDishAction() {
      const editId = document.getElementById('editItemId').value;
      const name = document.getElementById('dishName').value.trim();
      const categoryId = document.getElementById('dishCategory').value;
      const priceINR = parseFloat(document.getElementById('dishPriceINR').value);
      const dietaryType = document.getElementById('dishDietary').value;
      const station = document.getElementById('dishStation').value;
      const description = document.getElementById('dishDesc').value.trim();
      const imageUrl = document.getElementById('dishImageUrl').value.trim();

      if (!name) return alert('Please enter a dish name.');
      if (isNaN(priceINR) || priceINR <= 0) return alert('Please enter a valid price in INR.');

      const payload = {
        name,
        categoryId,
        basePriceCents: Math.round(priceINR * 100),
        dietaryType,
        station,
        description,
        imageUrl: imageUrl || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80',
      };

      try {
        let res;
        if (editId) {
          res = await apiFetch(`/api/v1/menu/items/${editId}`, {
            method: 'PATCH',
            body: JSON.stringify(payload),
          });
        } else {
          res = await apiFetch('/api/v1/menu/items', {
            method: 'POST',
            body: JSON.stringify(payload),
          });
        }
        if (!res.ok) throw new Error('Server returned ' + res.status);
        showToast(editId ? 'Dish updated successfully!' : 'New dish added with photo!');
        closeDishModal();
        await loadMenu();
      } catch (err) {
        showToast('Save failed: ' + err.message, 'error');
      }
    }

    async function toggleItem86(id, nextState) {
      try {
        const res = await apiFetch(`/api/v1/menu/items/${id}/toggle-86`, { method: 'PATCH' });
        if (!res.ok) throw new Error('Failed to update status');
        showToast('Availability updated');
        await loadMenu();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deleteDish(id, name) {
      if (!confirm(`Are you sure you want to delete "${name}" from the menu?`)) return;
      try {
        const res = await apiFetch(`/api/v1/menu/items/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Delete failed');
        showToast(`"${name}" removed from catalog`);
        await loadMenu();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function exportMenuJson() {
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(allMenuItems, null, 2));
      const a = document.createElement('a');
      a.setAttribute('href', dataStr);
      a.setAttribute('download', `abiruchi_menu_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    loadMenu();
  </script>
</body>
</html>
