<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offers & Smart Combos — Abiruchi Hotel Owner</title>
  <style>
    :root { --bg:#090a0f; --card:#12151f; --border:rgba(255,255,255,0.08); --text:#f8fafc; --muted:#94a3b8; --primary:#e11d48; --accent:#10b981; --sky:#38bdf8; --amber:#f59e0b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; }
    .sidebar { width:220px; min-height:100vh; background:#0d1017; border-right:1px solid var(--border); padding:20px 12px; display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
    .sidebar-brand { font-size:1.1rem; font-weight:800; color:#fff; padding:12px 12px 20px; letter-spacing:-0.02em; }
    .nav-link { display:block; padding:10px 12px; border-radius:10px; color:var(--muted); text-decoration:none; font-size:0.88rem; font-weight:600; transition:all 0.15s ease; }
    .nav-link:hover { background:rgba(255,255,255,0.05); color:#fff; }
    .nav-link.active { background:rgba(225,29,72,0.15); color:#fb7185; }
    .main-content { flex:1; padding:24px; overflow-y:auto; }
    .page-title { font-size:1.5rem; font-weight:800; color:#fff; margin-bottom:8px; letter-spacing:-0.02em; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:20px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px; margin-top:16px; }
    .offer-card { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:8px; }
    .offer-title { font-size:1.05rem; font-weight:800; color:#fff; display:flex; justify-content:space-between; align-items:center; }
    .badge { display:inline-block; padding:3px 8px; border-radius:6px; font-size:0.72rem; font-weight:700; }
    .badge-pct { background:rgba(16,185,129,0.15); color:var(--accent); }
    .badge-bogo { background:rgba(225,29,72,0.15); color:#fb7185; }
    .badge-fixed { background:rgba(56,189,248,0.15); color:var(--sky); }
    .btn { padding:8px 14px; border-radius:8px; border:none; font-size:0.82rem; font-weight:700; cursor:pointer; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-danger { background:rgba(239,68,68,0.15); color:#ef4444; border:1px solid rgba(239,68,68,0.3); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
    .form-group { display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
    .form-group label { font-size:0.75rem; font-weight:700; color:var(--muted); text-transform:uppercase; }
    .form-input { padding:10px; border-radius:8px; border:1px solid var(--border); background:rgba(0,0,0,0.3); color:#fff; font-size:0.88rem; }
  </style>
</head>
<body>
  <div id="navContainer"></div>
  <main class="main-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <div>
        <h1 class="page-title">🏷️ Offers & Smart Combos Engine</h1>
        <p style="font-size:0.85rem; color:var(--muted);">Automated, rule-based deals with anti-stacking protection and transparent customer savings.</p>
      </div>
      <button class="btn btn-primary" onclick="toggleCreateModal()">+ Create New Deal</button>
    </div>

    <!-- Active Offers Section -->
    <div class="card">
      <h3 style="font-size:1.1rem; font-weight:700; margin-bottom:12px;">Active Deal Rules</h3>
      <div id="offersGrid" class="grid">
        <p style="color:var(--muted); font-size:0.88rem;">Loading promotion rules...</p>
      </div>
    </div>

    <!-- Create Deal Form -->
    <div id="createModal" class="card" style="display:none; border-color:var(--primary);">
      <h3 style="font-size:1.1rem; font-weight:700; margin-bottom:14px;">Define Promotional Rule</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Offer Name</label>
          <input type="text" id="ofName" class="form-input" placeholder="e.g. Afternoon Coffee + Croissant Combo" />
        </div>
        <div class="form-group">
          <label>Discount Type</label>
          <select id="ofType" class="form-input">
            <option value="PERCENT_DISCOUNT">Percentage Discount (%)</option>
            <option value="FIXED_DISCOUNT">Flat Amount Discount ($)</option>
            <option value="BOGO">Buy 1 Get 1 (BOGO)</option>
            <option value="HAPPY_HOUR">Happy Hour Special</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Discount Value (% or $)</label>
          <input type="number" step="0.01" id="ofValue" class="form-input" placeholder="15 (for 15% or $15)" />
        </div>
        <div class="form-group">
          <label>Minimum Order Value ($)</label>
          <input type="number" step="0.01" id="ofMinOrder" class="form-input" placeholder="25.00" />
        </div>
      </div>
      <div class="form-group">
        <label>Description (Customer-Facing Banner Text)</label>
        <input type="text" id="ofDesc" class="form-input" placeholder="Save 15% on orders over $25 during dinner service" />
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn btn-danger" onclick="toggleCreateModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitOffer()">Launch Offer →</button>
      </div>
    </div>
  </main>

  <script src="/owner/shared.js"></script>
  <script>
    document.getElementById('navContainer').innerHTML = renderNav('offers');

    async function loadOffers() {
      try {
        const res = await apiFetch('/api/v1/offers?outletId=b0000000-0000-0000-0000-000000000001');
        const list = await res.json();
        const grid = document.getElementById('offersGrid');
        if (list.length === 0) {
          grid.innerHTML = '<p style="color:var(--muted); font-size:0.88rem;">No active deals currently configured.</p>';
          return;
        }
        grid.innerHTML = list.map(o => `
          <div class="offer-card">
            <div class="offer-title">
              <span>${o.name}</span>
              <span class="badge ${o.type === 'PERCENT_DISCOUNT' ? 'badge-pct' : o.type === 'BOGO' ? 'badge-bogo' : 'badge-fixed'}">${o.type}</span>
            </div>
            <p style="font-size:0.82rem; color:var(--muted);">${o.description || 'Applies automatically at checkout.'}</p>
            <div style="font-size:0.88rem; font-weight:700; color:var(--accent);">
              ${o.type === 'PERCENT_DISCOUNT' ? `${o.discountPercent}% Off` : o.type === 'FIXED_DISCOUNT' ? `$${(o.discountCents/100).toFixed(2)} Off` : '50% Off / BOGO Savings'}
              <span style="font-size:0.75rem; color:var(--muted); font-weight:normal; margin-left:8px;">(Min: $${((o.minOrderCents||0)/100).toFixed(2)})</span>
            </div>
            <div style="font-size:0.75rem; color:var(--muted); margin-top:4px;">
              Redemptions today: <strong>${o.usedToday || 0}</strong>
            </div>
          </div>
        `).join('');
      } catch (err) {
        showToast('Error loading offers', 'error');
      }
    }

    function toggleCreateModal() {
      const el = document.getElementById('createModal');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    async function submitOffer() {
      const name = document.getElementById('ofName').value.trim();
      const type = document.getElementById('ofType').value;
      const val = parseFloat(document.getElementById('ofValue').value || '0');
      const minOrder = parseFloat(document.getElementById('ofMinOrder').value || '0');
      const desc = document.getElementById('ofDesc').value.trim();

      if (!name) { showToast('Offer name is required', 'error'); return; }

      const payload = {
        outletId: 'b0000000-0000-0000-0000-000000000001',
        name,
        type,
        description: desc,
        discountPercent: type === 'PERCENT_DISCOUNT' || type === 'HAPPY_HOUR' ? val : 0,
        discountCents: type === 'FIXED_DISCOUNT' ? Math.round(val * 100) : 0,
        minOrderCents: Math.round(minOrder * 100),
      };

      try {
        const res = await apiFetch('/api/v1/owner/offers', { method: 'POST', body: JSON.stringify(payload) });
        if (res.ok) {
          showToast('Offer created successfully!');
          toggleCreateModal();
          loadOffers();
        }
      } catch (err) {
        showToast('Failed to create offer', 'error');
      }
    }

    loadOffers();
  </script>
</body>
</html>
