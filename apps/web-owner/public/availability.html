<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Availability — Abiruchi Hotel Owner</title>
  <style>
    :root { --bg:#090a0f; --card:#12151f; --border:rgba(255,255,255,0.08); --text:#f8fafc; --muted:#94a3b8; --primary:#e11d48; --accent:#10b981; --sky:#38bdf8; --amber:#f59e0b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; }
    .sidebar { width:220px; min-height:100vh; background:#0d1017; border-right:1px solid var(--border); padding:20px 12px; display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
    .sidebar-brand { font-size:1.1rem; font-weight:800; color:#fff; padding:12px 12px 20px; letter-spacing:-0.02em; }
    .nav-link { display:block; padding:10px 12px; border-radius:10px; color:var(--muted); text-decoration:none; font-size:0.88rem; font-weight:600; transition:all 0.15s ease; }
    .nav-link:hover { background:rgba(255,255,255,0.05); color:#fff; }
    .nav-link.active { background:rgba(225,29,72,0.15); color:#fb7185; }
    .main-content { flex:1; padding:24px; overflow-y:auto; }
    .page-title { font-size:1.5rem; font-weight:800; color:#fff; margin-bottom:20px; letter-spacing:-0.02em; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px; }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @media(max-width:768px) { body{flex-direction:column} .sidebar{width:100%;min-height:auto;flex-direction:row;flex-wrap:wrap;padding:12px} .sidebar-brand{display:none} }
    .category-label { font-size:0.72rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:12px; }
    .item-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); }
    .item-row:last-child { border-bottom:none; }
    .item-name { font-size:0.9rem; font-weight:600; color:#fff; }
    .item-price { font-size:0.82rem; color:var(--muted); margin-top:2px; }
    .toggle { position:relative; width:44px; height:24px; }
    .toggle input { opacity:0; width:0; height:0; }
    .slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#374151; border-radius:24px; transition:0.3s; }
    .slider:before { position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:0.3s; }
    input:checked + .slider { background:#10b981; }
    input:checked + .slider:before { transform:translateX(20px); }
    .search-bar { width:100%; padding:10px 14px; background:var(--card); border:1px solid var(--border); border-radius:10px; color:#fff; font-size:0.88rem; margin-bottom:16px; }
    .search-bar::placeholder { color:var(--muted); }
    .search-bar:focus { outline:none; border-color:rgba(225,29,72,0.4); }
    .sold-out-tag { font-size:0.72rem; font-weight:700; color:#fb7185; background:rgba(225,29,72,0.1); padding:2px 8px; border-radius:10px; margin-left:8px; }
    .empty-state { text-align:center; padding:48px; color:var(--muted); }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-brand">🍽️ Abiruchi Hotel</div>
    <a href="/owner" class="nav-link">📊 Dashboard</a>
    <a href="/owner/orders" class="nav-link">🎫 Orders</a>
    <a href="/owner/availability" class="nav-link active">🔴 Availability</a>
    <a href="/owner/payments" class="nav-link">💳 Payments</a>
    <a href="/owner/tokens" class="nav-link">🎟️ Tokens</a>
    <a href="/owner/bookings" class="nav-link">📅 Bookings</a>
    <a href="/owner/staff" class="nav-link">👥 Staff</a>
    <a href="/owner/settings" class="nav-link">⚙️ Settings</a>
    <div style="margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,0.08);">
      <a href="/" class="nav-link" target="_blank" rel="noopener noreferrer">👁️ Guest View</a>
    </div>
  </nav>
  <div class="main-content">
    <h1 class="page-title">Menu Availability</h1>
    <input class="search-bar" type="text" placeholder="Search menu items..." oninput="filterItems(this.value)">
    <div id="menuSections"><div class="empty-state">Loading menu...</div></div>
  </div>
  <script>
    const OUTLET_ID = 'b0000000-0000-0000-0000-000000000001';
    let menuData = [];
    let searchQuery = '';

    function filterItems(q) {
      searchQuery = q.toLowerCase();
      renderMenu();
    }

    async function toggleAvailability(itemId, available) {
      try {
        const res = await fetch(`/api/v1/menu/items/${itemId}/sold-out`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ isAvailable: available, actorId: 'owner', reason: '86d' })
        });
        if (!res.ok) throw new Error('Failed');
        showBanner(available ? 'Item marked available' : 'Item marked sold out', available ? '#10b981' : '#dc2626');
        await fetchMenu();
      } catch(e) {
        alert('Failed to update: ' + e.message);
      }
    }

    function showBanner(msg, color) {
      const el = document.createElement('div');
      el.style.cssText = `position:fixed;top:16px;right:16px;padding:12px 20px;border-radius:12px;font-weight:700;font-size:0.88rem;z-index:1000;background:${color};color:#fff;box-shadow:0 8px 24px rgba(0,0,0,0.5);`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    function renderMenu() {
      const container = document.getElementById('menuSections');
      if (!menuData.length) { container.innerHTML = '<div class="empty-state">No menu items found</div>'; return; }

      const categories = {};
      menuData.forEach(item => {
        const cat = item.category || 'Uncategorized';
        if (!categories[cat]) categories[cat] = [];
        if (!searchQuery || item.name.toLowerCase().includes(searchQuery) || cat.toLowerCase().includes(searchQuery)) {
          categories[cat].push(item);
        }
      });

      container.innerHTML = Object.entries(categories).filter(([,items]) => items.length > 0).map(([cat, items]) => `
        <div class="card">
          <div class="category-label">${cat}</div>
          ${items.map(item => `
            <div class="item-row">
              <div>
                <div class="item-name">
                  ${item.name}
                  ${!item.isAvailable ? '<span class="sold-out-tag">SOLD OUT</span>' : ''}
                </div>
                <div class="item-price">$${(item.price/100||item.price||0).toFixed(2)}</div>
              </div>
              <label class="toggle">
                <input type="checkbox" ${item.isAvailable !== false ? 'checked' : ''} onchange="toggleAvailability('${item.id}', this.checked)">
                <span class="slider"></span>
              </label>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    async function fetchMenu() {
      try {
        const res = await fetch(`/api/v1/menu?outletId=${OUTLET_ID}`);
        if (res.ok) {
          const data = await res.json();
          menuData = Array.isArray(data) ? data : (data.items || data.data || data.categories?.flatMap(c => c.items) || []);
          renderMenu();
        }
      } catch(e) { console.error(e); }
    }

    fetchMenu();
  </script>
</body>
</html>
