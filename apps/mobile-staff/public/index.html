<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Servora | Waitstaff Terminal</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --primary: #3b82f6;
      --accent: #22c55e;
      --warning: #f59e0b;
      --red: #ef4444;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #18181b;
      border-bottom: 2px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .staff-badge {
      background: #1e3a8a;
      color: #93c5fd;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* Live Alerts Section */
    .alerts-container {
      padding: 16px;
      background: #1f140e;
      border-bottom: 1px solid #7c2d12;
    }
    .alerts-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: 700;
      color: #fed7aa;
      font-size: 0.95rem;
    }
    .call-card {
      background: #2a1a12;
      border: 1px solid #c2410c;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .call-info { display: flex; flex-direction: column; gap: 2px; }
    .call-table { font-size: 1.15rem; font-weight: 800; color: #fff; }
    .call-reason { font-size: 0.85rem; color: #fed7aa; font-weight: 600; }
    .call-time { font-size: 0.75rem; color: #a1a1aa; }
    .ack-btn {
      background: #ea580c;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Floor Grid */
    main { padding: 16px; flex: 1; }
    .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; color: #fff; }
    .table-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .table-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
    }
    .table-pill.occupied { border-color: var(--primary); background: #131b2e; }
    .table-num { font-size: 1.15rem; font-weight: 800; color: #fff; }
    .table-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      align-self: flex-start;
    }
    .tag-free { background: #064e3b; color: #6ee7b7; }
    .tag-occupied { background: #1e3a8a; color: #93c5fd; }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 1.3rem;">🛎️</span>
      <div>
        <div style="font-weight: 800; font-size: 1rem; color: #fff;">Floor Staff Terminal</div>
        <div style="font-size: 0.75rem; color: var(--text-muted);">Trattoria Servora &bull; Station 1</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div class="status-dot"></div>
      <span class="staff-badge">ONLINE</span>
    </div>
  </header>

  <!-- Live Table Call Alerts -->
  <div class="alerts-container">
    <div class="alerts-header">
      <span>🔔 Live Guest Table Requests (<span id="alertCount">1</span>)</span>
    </div>
    <div id="alertsList">
      <div class="call-card" id="demoCallCard">
        <div class="call-info">
          <div class="call-table">Table T-01</div>
          <div class="call-reason">💧 Request: Bring Fresh Water</div>
          <div class="call-time">Just now</div>
        </div>
        <button class="ack-btn" onclick="dismissCall('demoCallCard')">Acknowledge &check;</button>
      </div>
    </div>
  </div>

  <!-- Floor Tables Status -->
  <main>
    <div class="section-title">Dining Room Floor Overview</div>
    <div class="table-grid" id="staffTableGrid">
      <div class="table-pill occupied">
        <div class="table-num">T-01</div>
        <span class="table-tag tag-occupied">Occupied</span>
        <div style="font-size: 0.8rem; color: #4ade80; font-weight: 700;">Tab: $28.36</div>
      </div>
      <div class="table-pill occupied">
        <div class="table-num">T-02</div>
        <span class="table-tag tag-occupied">Occupied</span>
        <div style="font-size: 0.8rem; color: #4ade80; font-weight: 700;">Tab: $58.88</div>
      </div>
      <div class="table-pill">
        <div class="table-num">T-03</div>
        <span class="table-tag tag-free">Available</span>
        <div style="font-size: 0.8rem; color: var(--text-muted);">Seats 4</div>
      </div>
      <div class="table-pill">
        <div class="table-num">T-04</div>
        <span class="table-tag tag-free">Available</span>
        <div style="font-size: 0.8rem; color: var(--text-muted);">Seats 6</div>
      </div>
      <div class="table-pill">
        <div class="table-num">Bar-01</div>
        <span class="table-tag tag-free">Available</span>
        <div style="font-size: 0.8rem; color: var(--text-muted);">Seats 1</div>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = window.location.origin;

    function dismissCall(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
      updateAlertCount();
    }

    function updateAlertCount() {
      const count = document.getElementById('alertsList').children.length;
      document.getElementById('alertCount').textContent = count;
      if (count === 0) {
        document.getElementById('alertsList').innerHTML = '<div style="font-size: 0.85rem; color: #a1a1aa; text-align: center; padding: 8px;">No active guest requests.</div>';
      }
    }

    // Connect to Server-Sent Events to capture TABLE_CALL_WAITER in real time!
    function initStaffEventStream() {
      const evtSource = new EventSource(`${API_BASE}/api/v1/events`);

      evtSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'TABLE_CALL_WAITER') {
            addCallAlert(data.payload);
          }
        } catch (e) {}
      };
    }

    function addCallAlert(call) {
      const list = document.getElementById('alertsList');
      const cardId = `call_${Date.now()}`;
      const html = `
        <div class="call-card" id="${cardId}">
          <div class="call-info">
            <div class="call-table">Table ${call.tableNumber}</div>
            <div class="call-reason">🔔 Request: ${call.reason}</div>
            <div class="call-time">Just now</div>
          </div>
          <button class="ack-btn" onclick="dismissCall('${cardId}')">Acknowledge &check;</button>
        </div>
      `;
      list.insertAdjacentHTML('afterbegin', html);
      updateAlertCount();
    }

    initStaffEventStream();
  </script>
</body>
</html>
