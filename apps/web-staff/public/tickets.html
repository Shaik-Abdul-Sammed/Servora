<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Tickets — Abiruchi Hotel Staff</title>
  <style>
    :root { --bg:#090a0f; --card:#12151f; --border:rgba(255,255,255,0.08); --text:#f8fafc; --muted:#94a3b8; --primary:#e11d48; --accent:#10b981; --sky:#38bdf8; --amber:#f59e0b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; }
    .sidebar { width:220px; min-height:100vh; background:#0d1017; border-right:1px solid var(--border); padding:20px 12px; display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
    .sidebar-brand { font-size:1.1rem; font-weight:800; color:#fff; padding:12px 12px 20px; letter-spacing:-0.02em; }
    .nav-link { display:block; padding:10px 12px; border-radius:10px; color:var(--muted); text-decoration:none; font-size:0.88rem; font-weight:600; transition:all 0.15s ease; }
    .nav-link:hover { background:rgba(255,255,255,0.05); color:#fff; }
    .nav-link.active { background:rgba(225,29,72,0.15); color:#fb7185; }
    .main-content { flex:1; padding:24px; overflow-y:auto; }
    .page-title { font-size:1.5rem; font-weight:800; color:#fff; margin-bottom:20px; letter-spacing:-0.02em; }
    .tickets-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
    .ticket { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; display:flex; flex-direction:column; }
    .ticket-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
    .ticket-table { font-size:1.1rem; font-weight:800; color:#fff; }
    .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:0.72rem; font-weight:700; }
    .badge-green { background:rgba(16,185,129,0.15); color:#10b981; }
    .badge-blue { background:rgba(56,189,248,0.15); color:#38bdf8; }
    .badge-amber { background:rgba(245,158,11,0.15); color:#f59e0b; }
    .item-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:0.88rem; }
    .item-qty { font-weight:700; color:#fff; margin-right:8px; }
    .item-station { font-size:0.72rem; color:var(--sky); background:rgba(56,189,248,0.1); padding:2px 6px; border-radius:6px; }
    .ticket-footer { margin-top:14px; padding-top:10px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    @media(max-width:768px) { body{flex-direction:column} .sidebar{width:100%;min-height:auto;flex-direction:row;flex-wrap:wrap;padding:12px} .sidebar-brand{display:none} }
  </style>
</head>
<body>
  <div id="navContainer"></div>
  <div class="main-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h1 class="page-title">🎫 Kitchen & Bar Ticket Rail</h1>
      <span style="font-size:0.8rem;color:var(--muted);">Live Orders Stream</span>
    </div>
    <div id="ticketsGrid" class="tickets-grid"></div>
  </div>

  <script src="/staff/shared.js"></script>
  <script>
    document.getElementById('navContainer').innerHTML = renderStaffNav('tickets');
    const OUTLET_ID = 'b0000000-0000-0000-0000-000000000001';

    async function loadTickets() {
      try {
        const res = await fetch(`/api/v1/orders/active?outletId=${OUTLET_ID}`);
        if (!res.ok) return;
        const orders = await res.json();
        const active = orders.filter(o => o.status !== 'CANCELLED' && o.status !== 'SERVED');
        const container = document.getElementById('ticketsGrid');

        if (active.length === 0) {
          container.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--muted);"><h3>No active tickets</h3><p style="margin-top:6px;font-size:0.85rem;">All kitchen and bar tickets have been served.</p></div>`;
          return;
        }

        container.innerHTML = active.map(o => {
          const badgeClass = o.status === 'PREPARING' ? 'badge-blue' : o.status === 'CONFIRMED' ? 'badge-amber' : 'badge-green';
          return `
            <div class="ticket">
              <div class="ticket-header">
                <div>
                  <div class="ticket-table">Table ${o.tableNumber}</div>
                  <div style="font-size:0.78rem;color:var(--muted);margin-top:2px;">#${o.id.slice(-6)}</div>
                </div>
                <span class="badge ${badgeClass}">${o.status}</span>
              </div>
              <div style="flex:1;">
                ${o.items.map(i => `
                  <div class="item-row">
                    <div>
                      <span class="item-qty">${i.quantity}x</span>
                      <span>${i.name}</span>
                    </div>
                    <span class="item-station">${i.station || 'KITCHEN'}</span>
                  </div>
                `).join('')}
              </div>
              <div class="ticket-footer">
                <span style="font-size:0.8rem;color:var(--muted);">${new Date(o.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
                <span style="font-size:0.9rem;font-weight:700;color:var(--accent);">$${(o.totalCents / 100).toFixed(2)}</span>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {}
    }

    loadTickets();
    setInterval(loadTickets, 4000);
  </script>
</body>
</html>
