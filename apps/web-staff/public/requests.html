<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Requests — Abiruchi Hotel Staff</title>
  <style>
    :root { --bg:#090a0f; --card:#12151f; --border:rgba(255,255,255,0.08); --text:#f8fafc; --muted:#94a3b8; --primary:#e11d48; --accent:#10b981; --sky:#38bdf8; --amber:#f59e0b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; }
    .sidebar { width:220px; min-height:100vh; background:#0d1017; border-right:1px solid var(--border); padding:20px 12px; display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
    .sidebar-brand { font-size:1.1rem; font-weight:800; color:#fff; padding:12px 12px 20px; letter-spacing:-0.02em; }
    .nav-link { display:block; padding:10px 12px; border-radius:10px; color:var(--muted); text-decoration:none; font-size:0.88rem; font-weight:600; transition:all 0.15s ease; }
    .nav-link:hover { background:rgba(255,255,255,0.05); color:#fff; }
    .nav-link.active { background:rgba(225,29,72,0.15); color:#fb7185; }
    .main-content { flex:1; padding:24px; overflow-y:auto; }
    .page-title { font-size:1.5rem; font-weight:800; color:#fff; margin-bottom:20px; letter-spacing:-0.02em; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
    .btn { padding:10px 18px; border-radius:10px; border:none; font-size:0.88rem; font-weight:700; cursor:pointer; transition:all 0.2s ease; }
    .btn-resolve { background:rgba(16,185,129,0.15); color:#10b981; border:1px solid rgba(16,185,129,0.3); }
    .btn-resolve:hover { background:#10b981; color:#fff; }
    .category-tag { font-size:0.8rem; font-weight:700; padding:4px 10px; border-radius:8px; display:inline-flex; align-items:center; gap:6px; }
    .empty-state { text-align:center; padding:48px; color:var(--muted); }
    @media(max-width:768px) { body{flex-direction:column} .sidebar{width:100%;min-height:auto;flex-direction:row;flex-wrap:wrap;padding:12px} .sidebar-brand{display:none} }
  </style>
</head>
<body>
  <div id="navContainer"></div>
  <div class="main-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h1 class="page-title">🛎️ Live Table Assistance Requests (P0 #62)</h1>
      <span style="font-size:0.8rem;color:var(--muted);">Auto-updating</span>
    </div>
    <div id="callsList"></div>
  </div>

  <script src="/staff/shared.js"></script>
  <script>
    document.getElementById('navContainer').innerHTML = renderStaffNav('requests');
    const OUTLET_ID = 'b0000000-0000-0000-0000-000000000001';

    const CATEGORY_META = {
      WATER: { label: '💧 Water Refill', bg: 'rgba(56,189,248,0.15)', color: '#38bdf8' },
      BILL: { label: '🧾 Request Bill', bg: 'rgba(245,158,11,0.15)', color: '#f59e0b' },
      CUTLERY: { label: '🍴 Extra Cutlery', bg: 'rgba(168,85,247,0.15)', color: '#c084fc' },
      SERVER: { label: '👋 Call Server', bg: 'rgba(236,72,153,0.15)', color: '#f472b6' },
      MANAGER: { label: '👔 Speak with Manager', bg: 'rgba(225,29,72,0.15)', color: '#fb7185' },
    };

    async function loadCalls() {
      try {
        const res = await fetch(`/api/v1/tables/calls/pending?outletId=${OUTLET_ID}`);
        if (!res.ok) return;
        const calls = await res.json();
        const container = document.getElementById('callsList');

        if (calls.length === 0) {
          container.innerHTML = `<div class="empty-state"><h3>All guests attended</h3><p style="margin-top:6px;font-size:0.85rem;">No active guest assistance calls pending.</p></div>`;
          return;
        }

        container.innerHTML = calls.map(c => {
          const meta = CATEGORY_META[c.category] || { label: c.category, bg: 'rgba(255,255,255,0.1)', color: '#fff' };
          return `
            <div class="card">
              <div>
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
                  <span style="font-size:1.15rem;font-weight:800;color:#fff;">Table ${c.tableNumber}</span>
                  <span class="category-tag" style="background:${meta.bg};color:${meta.color};">${meta.label}</span>
                </div>
                <div style="font-size:0.85rem;color:var(--muted);">
                  Requested at ${new Date(c.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}
                </div>
              </div>
              <button class="btn btn-resolve" onclick="resolveCall('${c.id}')">✓ Mark Handled</button>
            </div>
          `;
        }).join('');
      } catch (e) {}
    }

    async function resolveCall(callId) {
      const res = await fetch(`/api/v1/tables/calls/${callId}/resolve`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ staffId: 'waiter_01' })
      });
      if (res.ok) {
        showToast('Table request marked resolved!');
        loadCalls();
      }
    }

    loadCalls();
    setInterval(loadCalls, 3000);
  </script>
</body>
</html>
