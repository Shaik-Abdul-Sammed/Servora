services:
  - type: web
    name: servora-hotel-os
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: QR_SIGNING_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: UPI_VPA
        sync: false
      - key: UPI_PAYEE_NAME
        sync: false
      - key: UPI_MOBILE
        sync: false
      - key: PAYMENT_PROVIDER_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: WA_API_KEY
        sync: false
