# ==============================================================================
# Abiruchi Hotel High-Performance NGINX WAF & Reverse Proxy
# Tuned for 10,000+ Concurrent Connections on Free-Tier / Self-Hosted Hardware
# Features: Event-driven epoll, Cloudflare Real-IP, Rate Limiting, DDoS Buffers
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 20480; # Supports 10,000+ concurrent open file descriptors
pid /var/run/nginx.pid;

events {
    worker_connections 10240; # 10k concurrent connections per worker
    use epoll;                # High-performance Linux I/O multiplexing
    multi_accept on;          # Accept as many connections as possible after notification
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Anti-DDoS Buffer Protections (Mitigates Slowloris & Buffer Overflow)
    client_body_buffer_size 128k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    client_max_body_size 10M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;

    # Compression (Reduces bandwidth by up to 75% for 10k users)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --------------------------------------------------------------------------
    # Cloudflare Real-IP Restoration (Extract genuine client IP behind Cloudflare)
    # --------------------------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # --------------------------------------------------------------------------
    # WAF Rate Limiting Zones (Protects origin from flood attacks on Free Tier)
    # --------------------------------------------------------------------------
    # General API: 40 requests/sec per client IP with burst of 60
    limit_req_zone $binary_remote_addr zone=abiruchi_api_zone:10m rate=40r/s;
    # Auth & Login: 5 requests/sec per client IP with burst of 10
    limit_req_zone $binary_remote_addr zone=abiruchi_auth_zone:10m rate=5r/s;
    # Order Submission: 10 requests/sec per client IP
    limit_req_zone $binary_remote_addr zone=abiruchi_order_zone:10m rate=10r/s;

    # Return HTTP 429 when rate limited
    limit_req_status 429;

    # Upstream Abiruchi Hotel API
    upstream abiruchi_backend {
        server abiruchi-api:3001 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # 1. Healthcheck (no rate limiting, used by internal orchestrators / Cloudflare)
        location /health {
            proxy_pass http://abiruchi_backend/health;
            access_log off;
        }

        # 2. Authentication Protection
        location /api/v1/auth/ {
            limit_req zone=abiruchi_auth_zone burst=10 nodelay;
            proxy_pass http://abiruchi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Order Submission Protection
        location /api/v1/orders {
            limit_req zone=abiruchi_order_zone burst=20 nodelay;
            proxy_pass http://abiruchi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. General API Endpoints
        location /api/ {
            limit_req zone=abiruchi_api_zone burst=50 nodelay;
            proxy_pass http://abiruchi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Real-Time Server-Sent Events (SSE) Stream
        location /api/v1/events {
            proxy_pass http://abiruchi_backend/api/v1/events;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s; # Keep SSE open indefinitely
            chunked_transfer_encoding off;
        }

        # 6. Static Web Apps & Root (Edge caching friendly)
        location / {
            proxy_pass http://abiruchi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Browser cache control for static assets
            location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|json)$ {
                proxy_pass http://abiruchi_backend;
                expires 7d;
                add_header Cache-Control "public, max-age=604800, immutable";
            }
        }
    }
}
